name: Build wheels+sdist and publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
  build_wheels:
    name: Wheels on ${{ matrix.os }}, ${{ matrix.manylinux && format('-{0}', matrix.manylinux) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds: one job per manylinux baseline
          - os: ubuntu-latest
            manylinux: manylinux2014
            manylinux_x86_64_image: manylinux2014
          - os: ubuntu-latest
            manylinux: manylinux_2_28
            manylinux_x86_64_image: manylinux_2_28
          - os: ubuntu-latest
            manylinux: manylinux_2_34
            manylinux_x86_64_image: manylinux_2_34
          # Windows & macOS builds
          - os: windows-latest
          - os: macos-13   # Intel
          - os: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - uses: pypa/cibuildwheel@v3.1
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_x86_64_image }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}${{ matrix.manylinux && format('-{0}', matrix.manylinux) || '' }}
          path: wheelhouse/*.whl
  publish_all:
    name: Publish on PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
